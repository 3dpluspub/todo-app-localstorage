<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Yapılacaklar Listesi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <div class="header">
                <h1>📝 Yapılacaklar Listesi</h1>
                <p>Görevlerinizi yönetin ve takip edin</p>
            </div>

            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Yeni bir görev ekleyin..." 
                    class="todo-input"
                >
                <button id="addBtn" class="add-btn">
                    <span>➕</span> Ekle
                </button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Tümü</button>
                <button class="filter-btn" data-filter="active">Aktif</button>
                <button class="filter-btn" data-filter="completed">Tamamlanan</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Toplam:</span>
                    <span class="stat-value" id="totalTodos">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Aktif:</span>
                    <span class="stat-value" id="activeTodos">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tamamlanan:</span>
                    <span class="stat-value" id="completedTodos">0</span>
                </div>
            </div>

            <div id="todoList" class="todo-list">
                <!-- Todos will be added here dynamically -->
            </div>

            <div class="empty-state" id="emptyState">
                <p>📋 Henüz görev eklenmemiş</p>
            </div>

            <div class="actions">
                <button id="clearCompletedBtn" class="clear-btn">
                    ✓ Tamamlanmış Olanları Temizle
                </button>
                <button id="deleteAllBtn" class="delete-all-btn">
                    🗑️ Tümünü Sil
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
